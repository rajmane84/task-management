name: Code Quality & Fix

on:
  push:
    branches: [ main ]
    paths:
      - 'tm-backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'tm-backend/**'

jobs:
  fix-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Use the branch name (ref) so we are not in a "detached HEAD" state
          ref: ${{ github.head_ref || github.ref_name }} 

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Verify everything is actually clean now
      - name: Final Check
        run: |
          bun run lint
          bun run prettier:check